    - LEATHER_CHESTPLATE CHEST
  Options:
    PreventItemPickup: true
    FollowRange: 250
    KnockbackResistance: 0.2
    PreventSunburn: true
  Drops:
    - IRON_INGOT 1 0.4
    - GUNPOWDER 2 0.5
    - weaponMechanicsWeapon{weapon=suifaxiandanqiang} 1 0.85
  AIGoalSelectors:
    - clear
    - meleeattack
    - randomstroll
    - lookatplayers
    - randomlookaround
  AITargetSelectors:
    - clear
    - players
    - hurtbytarget
  Skills:
    # 霰弹装填 180 tick, 一发打完等 180 tick 再打一发
    - weaponMechanicsShoot{weapon=suifaxiandanqiang;spread=6} @Target ~onTimer:180 ?targetinlineofsight 0.5
    - weaponMechanicsShoot{weapon=suifaxiandanqiang;spread=6} @Target ~onTimer:180 ?targetinlineofsight 0.5
    - weaponMechanicsShoot{weapon=suifaxiandanqiang;spread=6} @Target ~onTimer:180 ?targetinlineofsight 0.5
    - weaponMechanicsShoot{weapon=suifaxiandanqiang;spread=6} @Target ~onTimer:180 ?targetinlineofsight 0.5
    - weaponMechanicsShoot{weapon=suifaxiandanqiang;spread=6} @trigger ~onDamaged
    - sound{s=block.note_block.bell;v=0.5;p=1.0} @self ~onSpawn
    - sound{s=entity.generic.explode;v=0.3;p=1.4} @self ~onDeath
